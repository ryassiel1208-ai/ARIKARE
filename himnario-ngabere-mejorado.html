<!DOCTYPE html>
<html lang="ngb">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Himnario Ngäbere</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E📖%3C/text%3E%3C/svg%3E">
<style>
:root{--bg:#f6f3ec;--sf:#fff;--tx:#1f2a37;--mu:#6b7280;--ac:#7a1f2b;--bd:#ddd6c8;--fs:22px;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14161a;--sf:#1e2127;--tx:#ece8df;--mu:#9aa0aa;--ac:#e0a458;--bd:#2d323a}}
:root[data-theme="dark"]{--bg:#14161a;--sf:#1e2127;--tx:#ece8df;--mu:#9aa0aa;--ac:#e0a458;--bd:#2d323a}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body{max-width:900px;margin:0 auto;padding:18px 14px 32px;background:var(--bg)}
h1{font-size:1.35rem;margin:0;letter-spacing:-.03em}header{display:flex;align-items:center;gap:10px;justify-content:space-between;margin:4px 0 18px;padding:14px 16px;border:1px solid var(--bd);border-radius:18px;background:var(--sf);box-shadow:0 5px 18px #00000008}
.logo{display:flex;align-items:center;gap:10px}.logo span{display:grid;place-items:center;width:44px;height:44px;border-radius:14px;background:var(--ac);color:white;font-size:1.45rem}.logo small{display:block;color:var(--mu);font-size:.78rem;margin-top:2px}
button,.btn{font:inherit;background:var(--sf);color:var(--tx);border:1px solid var(--bd);border-radius:13px;padding:11px 15px;min-height:46px;cursor:pointer;transition:transform .15s,border-color .15s}button:active{transform:scale(.98)}
button.p{background:var(--ac);color:var(--bg);border-color:var(--ac);font-weight:600}
button.on{border-color:var(--ac);color:var(--ac);font-weight:600}
input,textarea{font:inherit;width:100%;background:var(--sf);color:var(--tx);border:1px solid var(--bd);border-radius:12px;padding:12px}
#q{font-size:1.08rem;padding:17px 16px;border:2px solid var(--ac);border-radius:15px;box-shadow:0 5px 18px #0000000a}#searchhint{margin:7px 3px 13px;color:var(--mu);font-size:.82rem}#resultcount{margin:12px 3px 8px;color:var(--mu);font-size:.84rem}
nav{display:flex;gap:8px;margin:12px 0 15px;flex-wrap:wrap}nav button{flex:1;min-width:90px;border-radius:999px;padding:10px 13px}nav button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.item{display:flex;gap:12px;align-items:center;padding:14px 15px;background:var(--sf);border:1px solid var(--bd);border-radius:15px;margin-bottom:9px;cursor:pointer;box-shadow:0 3px 12px #00000006;transition:transform .15s,border-color .15s}.item:active{transform:scale(.99);border-color:var(--ac)}.songtext{flex:1;min-width:0}.songtitle{font-weight:650;line-height:1.3}.songspanish{color:var(--mu);font-size:.87rem;margin-top:4px;line-height:1.3}.songinfo{color:var(--ac);font-size:.78rem;margin-top:5px;font-weight:600}
.item b{min-width:3.2rem;color:var(--ac);font-size:1.15rem}.mu{color:var(--mu);font-size:.9rem}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}.bar>*{flex:1}
.stz{white-space:pre-wrap;font-size:var(--fs);line-height:1.5;margin:0 0 1.2em}
.cor{border-left:4px solid var(--ac);padding-left:14px;font-style:italic}
.tag{display:inline-block;background:var(--ac);color:var(--bg);border-radius:6px;padding:1px 6px;font-size:.75rem;margin-left:6px}
label{display:block;margin:10px 0 4px;color:var(--mu);font-size:.9rem}
#pres{position:fixed;inset:0;z-index:9;display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:5vh 6vw;user-select:none}
#pres .t{white-space:pre-wrap;line-height:1.35;font-weight:600;max-width:100%;overflow-wrap:anywhere}
#pres .k{opacity:.6;margin-bottom:1rem}
#pc{position:fixed;left:0;right:0;top:0;display:none;gap:8px;flex-wrap:wrap;padding:10px;background:#000c;color:#fff;z-index:10;align-items:center}
#pc button,#pc input{min-height:44px;width:auto;padding:8px 12px}
#pc input[type=color]{padding:2px;width:48px}
#gear{position:fixed;right:8px;top:8px;z-index:11;opacity:.35;background:#0008;color:#fff;border:0;border-radius:50%;width:48px;height:48px;padding:0;display:none}
</style>
</head>
<body>
<div id="app"></div>
<div id="pres"></div><div id="pc"></div><button id="gear" aria-label="Ajustes">⚙</button>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
// Solo para buscar: se ignoran tildes/diéresis. El texto original nunca se modifica.
const norm=s=>String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
const ld=(k,d)=>{try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}};
const sv=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
const DEMO=[1,2,3].map(n=>({n,t:'[DATO DE PRUEBA] Himno de ejemplo '+n,v:['[DATO DE PRUEBA] Estrofa 1 de ejemplo.\nSustituir por letra auténtica.','[DATO DE PRUEBA] Estrofa 2 de ejemplo.\nSustituir por letra auténtica.'],c:'[DATO DE PRUEBA] Coro de ejemplo.',i:'Dato de prueba, no es un himno real.',demo:1}));
let H=ld('h',null)||DEMO, F=new Set(ld('f',[])), R=ld('r',[]), S=ld('s',{fs:22,theme:'auto'});
let tab='all', q='', cur=null, edit=null;
const save=()=>{sv('h',H);sv('f',[...F]);sv('r',R);sv('s',S)};
const applyS=()=>{const r=document.documentElement;r.style.setProperty('--fs',S.fs+'px');S.theme==='auto'?r.removeAttribute('data-theme'):r.setAttribute('data-theme',S.theme)};
const byN=n=>H.find(h=>h.n==n);
// Recupera la traducción que aparece entre corchetes o paréntesis en el título.
function spanishTitle(h){
  const m=String(h.t||'').match(/\[[^\]]+\]|\([^)]*\)/g);
  return m?m.map(x=>x.slice(1,-1).trim()).filter(Boolean).join(' · '):'';
}
function searchText(h){return norm([h.t,spanishTitle(h),h.i].filter(Boolean).join(' '));}
function list(){
  let a=[...H];
  if(tab==='fav')a=a.filter(h=>F.has(h.n));
  if(tab==='rec')a=R.map(byN).filter(Boolean);
  const raw=q.trim(),s=norm(raw),terms=s.split(/\s+/).filter(Boolean);
  if(s){
    a=a.filter(h=>{
      const hay=searchText(h);
      const number=String(h.n);
      return (/^\d+$/.test(s)&&(number===s||number.startsWith(s))) || terms.every(term=>hay.includes(term));
    });
    a.sort((x,y)=>{
      const exact=(String(y.n)===s)-(String(x.n)===s);
      if(exact)return exact;
      const xs=searchText(x),ys=searchText(y);
      return (ys.startsWith(s)?1:0)-(xs.startsWith(s)?1:0);
    });
  }else if(tab==='abc')a.sort((x,y)=>norm(x.t).localeCompare(norm(y.t)));
  else if(tab!=='rec')a.sort((x,y)=>x.n-y.n);
  return a;
}
function home(){
  cur=null;edit=null;
  $('#app').innerHTML=`<header><div class="logo"><span>♫</span><div><h1>Himnario Ngäbere</h1><small>Encuentra y presenta tus himnos</small></div></div>
  <div style="display:flex;gap:6px"><button id="th" aria-label="Tema">◐</button><button id="adm" aria-label="Administración">⚙</button></div></header>
  <input id="q" type="search" inputmode="search" placeholder="Busca por número, título ngäbere o español…" value="${esc(q)}" autocomplete="off">
  <div id="searchhint">También puedes buscar por tonalidad o notas musicales (ej. Do, Fa, Mi♭).</div>
  <nav>${[['all','Números'],['abc','A–Z'],['fav','★ Favoritos'],['rec','Recientes']].map(([k,l])=>`<button data-t="${k}" class="${tab===k?'on':''}">${l}</button>`).join('')}</nav>
  <div id="resultcount"></div><div id="ls"></div>`;
  $('#q').oninput=e=>{q=e.target.value;fill()};
  document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{tab=b.dataset.t;home();$('#q').focus()});
  $('#th').onclick=()=>{S.theme=S.theme==='dark'?'light':'dark';save();applyS()};
  $('#adm').onclick=admin;
  fill();
}
function fill(){
  const a=list();
  $('#resultcount').textContent=q.trim()?`${a.length} resultado${a.length===1?'':'s'} para «${q.trim()}»`:`${a.length} himnos`;
  $('#ls').innerHTML=a.length?a.slice(0,400).map(h=>{
    const es=spanishTitle(h),info=String(h.i||'').trim();
    return `<div class="item" data-n="${esc(h.n)}"><b>${esc(h.n)}</b><div class="songtext"><div class="songtitle">${esc(h.t)}${h.demo?'<span class="tag">PRUEBA</span>':''}</div>${es?`<div class="songspanish">Español: ${esc(es)}</div>`:''}${info?`<div class="songinfo">♫ ${esc(info)}</div>`:''}</div>${F.has(h.n)?'<span aria-label="Favorito">★</span>':''}<span class="mu">›</span></div>`;
  }).join('')+(a.length>400?'<p class="mu">Se muestran 400 resultados; afine la búsqueda.</p>':''):'<p class="mu">No encontramos himnos. Prueba con otra palabra, el número o una tonalidad.</p>';
  document.querySelectorAll('.item').forEach(e=>e.onclick=()=>read(e.dataset.n));
}
function read(n){
  const h=byN(n);if(!h)return home();cur=h;
  R=[h.n,...R.filter(x=>x!=h.n)].slice(0,30);save();
  const all=[...H].sort((a,b)=>a.n-b.n),i=all.findIndex(x=>x.n==h.n);
  $('#app').innerHTML=`<div class="bar"><button id="bk">← Volver</button><button id="fv" class="${F.has(h.n)?'on':''}">${F.has(h.n)?'★ Favorito':'☆ Favorito'}</button><button id="pr" class="p">▶ Presentar</button></div>
  <div class="bar"><button id="fm">A−</button><button id="fp">A+</button><button id="th">◐ Tema</button></div>
  <h2><span style="color:var(--ac)">${esc(h.n)}.</span> ${esc(h.t)}${h.demo?'<span class="tag">PRUEBA</span>':''}</h2>
  ${h.v.map(s=>`<p class="stz">${esc(s)}</p>`+(h.c?`<p class="stz cor">${esc(h.c)}</p>`:'')).join('')}
  ${h.i?`<p class="mu">${esc(h.i)}</p>`:''}
  <div class="bar"><button id="pv" ${i<1?'disabled':''}>← Anterior</button><button id="nx" ${i>=all.length-1?'disabled':''}>Siguiente →</button></div>`;
  $('#bk').onclick=home;$('#pr').onclick=()=>present(h);
  $('#fv').onclick=()=>{F.has(h.n)?F.delete(h.n):F.add(h.n);save();read(h.n)};
  $('#fm').onclick=()=>{S.fs=Math.max(14,S.fs-2);save();applyS()};
  $('#fp').onclick=()=>{S.fs=Math.min(60,S.fs+2);save();applyS()};
  $('#th').onclick=()=>{S.theme=S.theme==='dark'?'light':'dark';save();applyS()};
  $('#pv').onclick=()=>read(all[i-1].n);$('#nx').onclick=()=>read(all[i+1].n);
}
// ---- Presentación ----
let P={h:null,i:0,bg:'#000000',fg:'#ffffff',sz:6,coro:true,slides:[]};
function slides(h){
  const a=[{k:'',t:h.n+'\n'+h.t,title:1}];
  h.v.forEach((s,j)=>{a.push({k:`Estrofa ${j+1}/${h.v.length}`,t:s});if(h.c&&P.coro)a.push({k:'Coro',t:h.c})});
  return a;
}
function present(h){P.h=h;P.i=0;P.slides=slides(h);$('#pres').style.display='flex';$('#gear').style.display='block';draw();
  try{document.documentElement.requestFullscreen&&document.documentElement.requestFullscreen()}catch(e){}}
function draw(){
  const s=P.slides[P.i],p=$('#pres');
  p.style.background=P.bg;p.style.color=P.fg;
  p.innerHTML=`${s.k?`<div class="k" style="font-size:${P.sz*.45}vmin">${esc(P.h.n)} · ${esc(s.k)}</div>`:''}<div class="t" style="font-size:${s.title?P.sz*1.2:P.sz}vmin">${esc(s.t)}</div>`;
}
function go(d){const n=P.i+d;if(n>=0&&n<P.slides.length){P.i=n;draw()}}
function closeP(){$('#pres').style.display='none';$('#pc').style.display='none';$('#gear').style.display='none';
  try{document.fullscreenElement&&document.exitFullscreen()}catch(e){}}
function ctrl(){
  const c=$('#pc');c.style.display=c.style.display==='flex'?'none':'flex';
  c.innerHTML=`<button id="c1">A−</button><button id="c2">A+</button>Fondo<input type="color" id="cb" value="${P.bg}">Letra<input type="color" id="cf" value="${P.fg}">
  <label style="margin:0;color:#fff"><input type="checkbox" id="cc" ${P.coro?'checked':''} style="width:auto"> Coro tras cada estrofa</label><button id="cx">✕ Salir</button>`;
  $('#c1').onclick=()=>{P.sz=Math.max(2,P.sz-.5);draw()};$('#c2').onclick=()=>{P.sz=Math.min(14,P.sz+.5);draw()};
  $('#cb').oninput=e=>{P.bg=e.target.value;draw()};$('#cf').oninput=e=>{P.fg=e.target.value;draw()};
  $('#cc').onchange=e=>{P.coro=e.target.checked;P.slides=slides(P.h);P.i=Math.min(P.i,P.slides.length-1);draw()};
  $('#cx').onclick=closeP;
}
$('#gear').onclick=ctrl;
$('#pres').onclick=e=>{const x=e.clientX/innerWidth;go(x<.35?-1:1)};
let tx=0;$('#pres').ontouchstart=e=>{tx=e.touches[0].clientX};
document.addEventListener('keydown',e=>{
  if($('#pres').style.display!=='flex')return;
  if(['ArrowRight','ArrowDown','PageDown',' ','Enter'].includes(e.key)){e.preventDefault();go(1)}
  else if(['ArrowLeft','ArrowUp','PageUp','Backspace'].includes(e.key)){e.preventDefault();go(-1)}
  else if(e.key==='Escape')closeP();
});
// ---- Administración ----
function admin(){
  edit=null;
  $('#app').innerHTML=`<div class="bar"><button id="bk">← Volver</button><button id="ad" class="p">+ Nuevo himno</button></div>
  <h2>Administración (${H.length} himnos)</h2>
  <div class="bar"><button id="ex">⬇ Exportar respaldo (JSON)</button><button id="im">⬆ Importar TXT / CSV / JSON</button></div>
  <input type="file" id="fi" accept=".txt,.csv,.json" multiple hidden>
  <p class="mu">Formato TXT: cada himno empieza con «número | título», estrofas separadas por una línea en blanco, el coro empieza con «CORO:», y los himnos se separan con una línea «====». CSV: columnas numero, titulo, letra, coro (estrofas separadas por una línea en blanco o por ||). Importar reemplaza himnos con el mismo número. Excel (XLSX): guárdelo como CSV UTF-8 antes de importar.</p>
  <div id="ls"></div>
  <div class="bar"><button id="dm">Quitar himnos de prueba</button></div>`;
  $('#bk').onclick=home;$('#ad').onclick=()=>form({n:Math.max(0,...H.map(h=>+h.n||0))+1,t:'',v:[''],c:'',i:''},true);
  $('#ex').onclick=()=>{const b=new Blob([JSON.stringify(H,null,1)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='himnario-ngabere-respaldo.json';a.click()};
  $('#im').onclick=()=>$('#fi').click();$('#fi').onchange=imp;
  $('#dm').onclick=()=>{H=H.filter(h=>!h.demo);save();admin()};
  const a=[...H].sort((x,y)=>x.n-y.n);
  $('#ls').innerHTML=a.slice(0,500).map(h=>`<div class="item" data-n="${esc(h.n)}"><b>${esc(h.n)}</b><div style="flex:1">${esc(h.t)}</div><span class="mu">Editar</span></div>`).join('');
  document.querySelectorAll('.item').forEach(e=>e.onclick=()=>form({...byN(e.dataset.n)},false));
}
function form(h,isNew){
  const old=h.n;
  $('#app').innerHTML=`<div class="bar"><button id="bk">← Cancelar</button></div><h2>${isNew?'Nuevo himno':'Editar himno'}</h2>
  <label>Número</label><input id="fn" value="${esc(h.n)}"><label>Título</label><input id="ft" value="${esc(h.t)}">
  <label>Estrofas (separadas por una línea en blanco)</label><textarea id="fv" rows="10">${esc(h.v.join('\n\n'))}</textarea>
  <label>Coro (opcional)</label><textarea id="fc" rows="3">${esc(h.c)}</textarea>
  <label>Información adicional (opcional)</label><input id="fi2" value="${esc(h.i)}">
  <div class="bar"><button id="sv" class="p">Guardar</button>${isNew?'':'<button id="dl">Eliminar</button>'}</div>`;
  $('#bk').onclick=admin;
  $('#sv').onclick=()=>{
    const n=$('#fn').value.trim(),t=$('#ft').value.trim();if(!n||!t)return alert('Número y título son obligatorios.');
    const o={n:isNaN(n)?n:+n,t,v:$('#fv').value.split(/\n\s*\n/).map(s=>s.trim()).filter(Boolean),c:$('#fc').value.trim(),i:$('#fi2').value.trim()};
    if(!isNew&&h.demo)o.demo=0;
    H=H.filter(x=>x.n!=old&&x.n!=o.n);H.push(o);save();admin();
  };
  if(!isNew)$('#dl').onclick=()=>{if(confirm('¿Eliminar este himno?')){H=H.filter(x=>x.n!=old);F.delete(old);save();admin()}};
}
function csv(t){const r=[];let row=[],c='',q=false;t=t.replace(/^\uFEFF/,'');
  for(let i=0;i<t.length;i++){const ch=t[i];
    if(q){if(ch=='"'){if(t[i+1]=='"'){c+='"';i++}else q=false}else c+=ch}
    else if(ch=='"')q=true;else if(ch==','||ch==';'){row.push(c);c=''}
    else if(ch=='\n'){row.push(c);r.push(row);row=[];c=''}else if(ch!='\r')c+=ch}
  if(c||row.length){row.push(c);r.push(row)}return r}
const stz=s=>String(s||'').split(/\n\s*\n|\|\|/).map(x=>x.trim()).filter(Boolean);
async function imp(e){
  let add=[];
  for(const f of e.target.files){
    const t=await f.text(),ext=f.name.split('.').pop().toLowerCase();
    try{
      if(ext==='json'){const j=JSON.parse(t);(Array.isArray(j)?j:[j]).forEach(h=>add.push({n:h.n??h.numero,t:h.t??h.titulo,v:h.v??stz(h.letra),c:h.c??h.coro??'',i:h.i??h.info??''}))}
      else if(ext==='csv'){const r=csv(t);const hd=r[0].map(x=>norm(x.trim()));const ix=k=>hd.indexOf(k);
        r.slice(1).forEach(x=>{if(x[ix('numero')])add.push({n:x[ix('numero')].trim(),t:(x[ix('titulo')]||'').trim(),v:stz(x[ix('letra')]),c:(x[ix('coro')]||'').trim(),i:''})})}
      else t.replace(/\r/g,'').split(/^====+\s*$/m).forEach(b=>{b=b.trim();if(!b)return;
        const m=b.match(/^(.+?)\s*[|.]\s*(.+)\n?([\s\S]*)$/);if(!m)return;
        const v=[];let c='';stz(m[3].replace(/\n\s*\n/g,'||')).forEach(s=>/^CORO:/i.test(s)?c=s.replace(/^CORO:\s*/i,''):v.push(s));
        add.push({n:m[1].trim(),t:m[2].trim(),v,c,i:''})})
    }catch(err){alert('No se pudo leer '+f.name)}
  }
  add=add.filter(h=>h.n!==undefined&&h.n!==''&&h.t).map(h=>({...h,n:isNaN(h.n)?h.n:+h.n,v:h.v||[]}));
  if(!add.length)return alert('No se encontraron himnos válidos.');
  const ns=new Set(add.map(h=>String(h.n)));H=H.filter(h=>!ns.has(String(h.n))).concat(add);save();
  alert(add.length+' himnos importados.');admin();
}
applyS();home();
</script>
</body>
</html>
