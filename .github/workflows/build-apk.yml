name: Construir APK
on:
  workflow_dispatch:
  push:
    branches: [main, master]
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        variante: [lector, admin]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Preparar app (pagina, nombre e iconos)
        env:
          VARIANTE: ${{ matrix.variante }}
        run: |
          python3 -m pip install --quiet pillow
          python3 construir.py
      - run: npm install @capacitor/app@6 @capacitor/share@6 @capacitor/filesystem@6 @capacitor/status-bar@6
      - run: npx cap add android
      - name: Generar iconos
        continue-on-error: true
        run: |
          npm install --no-save @capacitor/assets@3
          npx capacitor-assets generate --android
      - run: npx cap sync android
      - run: |
          chmod +x android/gradlew
          cd android && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: ka-ngabere-${{ matrix.variante }}-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
