name: Construir APK
on:
  workflow_dispatch:
  push:
    branches: [main, master]
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        variante: [lector, editor]
    steps:
      - uses: actions/checkout@v4
      - name: Preparar www
        run: |
          mkdir -p www
          cp index.html manifest.webmanifest icon-192.png icon-512.png www/
          if [ "${{ matrix.variante }}" = "lector" ]; then
            sed -i 's#/\*MODO\*/false#true#' www/index.html
          else
            sed -i 's#"appId": "[^"]*"#"appId": "com.ngabere.himnario.editor"#; s#"appName": "[^"]*"#"appName": "Himnario Editor"#' capacitor.config.json
          fi
          grep -n "const MODO_LECTOR" www/index.html
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm install
      - run: npx cap add android
      - name: Generar iconos
        continue-on-error: true
        run: |
          npm install --no-save @capacitor/assets@3
          npx capacitor-assets generate --android --iconBackgroundColor '#7a1f2b' --iconBackgroundColorDark '#7a1f2b'
      - run: npx cap sync android
      - run: |
          chmod +x android/gradlew
          cd android && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: himnario-ngabere-${{ matrix.variante }}-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
