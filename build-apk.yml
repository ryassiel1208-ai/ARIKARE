
name: Construir APK Release

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Instalar dependencias
        run: npm install

      - name: Preparar Android
        run: npx cap add android

      - name: Generar iconos
        continue-on-error: true
        run: |
          npm install --no-save @capacitor/assets@3
          npx capacitor-assets generate --android \
            --iconBackgroundColor '#7a1f2b' \
            --iconBackgroundColorDark '#7a1f2b'

      - name: Sincronizar Capacitor
        run: npx cap sync android

      - name: Preparar clave de firma
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/release-key.jks

      - name: Compilar APK Release
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleRelease

      - name: Firmar APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          APK=$(find android/app/build/outputs/apk/release \
            -name '*-unsigned.apk' | head -n 1)

          if [ -z "$APK" ]; then
            APK=$(find android/app/build/outputs/apk/release \
              -name '*.apk' | head -n 1)
          fi

          BUILD_TOOLS=$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -n 1)
          ZIPALIGN="$ANDROID_HOME/build-tools/$BUILD_TOOLS/zipalign"
          APKSIGNER="$ANDROID_HOME/build-tools/$BUILD_TOOLS/apksigner"

          "$ZIPALIGN" -v -p 4 "$APK" /tmp/aligned.apk

          "$APKSIGNER" sign \
            --ks android/app/release-key.jks \
            --ks-pass env:KEYSTORE_PASSWORD \
            --ks-key-alias "$KEY_ALIAS" \
            --key-pass env:KEY_PASSWORD \
            --out app-release.apk \
            /tmp/aligned.apk

          "$APKSIGNER" verify --verbose app-release.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Ka-Ngabere-app-release
          path: app-release.apk

